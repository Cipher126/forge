[project]
name = "forge-platform"
version = "0.1.0"
description = "An API-driven distributed job execution platform built from first principles."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic>=1.16",
    "asyncpg>=0.31",
    "boto3>=1.40",
    "fastapi>=0.116",
    "opentelemetry-api>=1.38",
    "opentelemetry-exporter-otlp-proto-http>=1.38",
    "opentelemetry-sdk>=1.38",
    "pydantic-settings>=2.10",
    "redis>=6.4",
    "sqlalchemy[asyncio]>=2.0",
    "structlog>=25.4",
    "uvicorn[standard]>=0.35",
]

[project.scripts]
forge = "forge.cli:main"
forge-api = "forge.processes.api:main"
forge-dispatcher = "forge.processes.dispatcher:main"
forge-worker = "forge.processes.worker:main"
forge-scheduler = "forge.processes.scheduler:main"
forge-recovery = "forge.processes.recovery:main"
forge-maintenance = "forge.processes.maintenance:main"

[dependency-groups]
dev = [
    "httpx>=0.28",
    "hypothesis>=6.138",
    "mypy>=1.17",
    "pytest>=8.4",
    "pytest-asyncio>=1.1",
    "ruff>=0.12",
    "testcontainers[postgres,redis]>=4.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forge"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: requires Forge's PostgreSQL and Redis development services",
    "failure: controlled resilience and recovery scenarios",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.14"
strict = true
packages = ["forge"]
mypy_path = "src"

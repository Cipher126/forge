pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 2048; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    sendfile on;
    client_max_body_size 10m;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    resolver 127.0.0.11 valid=5s ipv6=off;
    map $uri $forge_cache {
        default "no-store";
        ~^/assets/ "public, max-age=31536000, immutable";
    }
    map $request_uri $forge_csp {
        default "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'";
        ~^/api/docs "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: https://fastapi.tiangolo.com; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'";
    }
    server {
        listen 8080;
        root /usr/share/nginx/html;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy $forge_csp always;
        add_header Cache-Control $forge_cache always;
        location = /healthz { access_log off; return 200 'ok'; add_header Content-Type text/plain; }
        location /api/ {
            set $forge_api ${FORGE_API_UPSTREAM};
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://$forge_api$uri$is_args$args;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_connect_timeout 3s;
            proxy_read_timeout 70s;
        }
        # FastAPI's interactive documentation requests its schema at this path.
        location = /openapi.json {
            set $forge_api ${FORGE_API_UPSTREAM};
            proxy_pass http://$forge_api/openapi.json;
        }
        location /v1/ {
            set $forge_api ${FORGE_API_UPSTREAM};
            proxy_pass http://$forge_api$request_uri;
            proxy_http_version 1.1;
            proxy_buffering off;
        }
        location /assets/ { try_files $uri =404; }
        location / { try_files $uri $uri/ /index.html; }
    }
}

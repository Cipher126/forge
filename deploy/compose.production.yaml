x-forge-process: &forge-process
  image: ${FORGE_IMAGE:-forge:local}
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  env_file:
    - ${FORGE_ENV_FILE:-../.env.production}
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  security_opt:
    - no-new-privileges:true

services:
  migrate:
    <<: *forge-process
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  api:
    <<: *forge-process
    command: ["forge-api"]
    ports:
      - "${FORGE_PUBLIC_PORT:-8000}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  dispatcher:
    <<: *forge-process
    command: ["forge-dispatcher"]

  worker:
    <<: *forge-process
    command: ["forge-worker"]
    stop_grace_period: 2m

  scheduler:
    <<: *forge-process
    command: ["forge-scheduler"]

  recovery:
    <<: *forge-process
    command: ["forge-recovery"]

  maintenance:
    <<: *forge-process
    command: ["forge-maintenance"]

services:
  api-1:
    environment: &tracing-environment
      FORGE_OTLP_TRACING_ENABLED: "true"
      FORGE_OTLP_TRACES_ENDPOINT: http://tempo:4318/v1/traces
      FORGE_TRACE_SAMPLE_RATIO: "1.0"

  api-2:
    environment: *tracing-environment

  worker-1:
    environment: *tracing-environment

  worker-2:
    environment: *tracing-environment

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    ports:
      - "19090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/metrics-token:/run/forge/metrics-token:ro
      - observability-prometheus:/prometheus
    depends_on:
      proxy:
        condition: service_started
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.10.8
    command: ["-config.file=/etc/tempo.yml"]
    ports:
      - "13200:3200"
    volumes:
      - ./observability/tempo.yml:/etc/tempo.yml:ro
      - observability-tempo:/var/tempo
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.1.7
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    ports:
      - "13000:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - observability-grafana:/var/lib/grafana
    depends_on:
      - prometheus
      - tempo
    restart: unless-stopped

volumes:
  observability-prometheus:
  observability-tempo:
  observability-grafana:

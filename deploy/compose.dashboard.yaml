services:
  dashboard:
    image: forge-dashboard:local
    build:
      context: ..
      dockerfile: dashboard/Dockerfile
    environment:
      FORGE_API_UPSTREAM: proxy:8080
    ports:
      - "127.0.0.1:13010:8080"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    depends_on:
      proxy:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

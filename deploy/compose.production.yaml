x-forge-process: &forge-process
  image: ${FORGE_IMAGE:-forge:local}
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  env_file:
    - ${FORGE_ENV_FILE:-../.env.production}
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  dashboard:
    image: ${FORGE_DASHBOARD_IMAGE:-forge-dashboard:local}
    build:
      context: ..
      dockerfile: dashboard/Dockerfile
    environment:
      FORGE_API_UPSTREAM: api:8000
    ports:
      - "${FORGE_DASHBOARD_BIND:-127.0.0.1}:${FORGE_DASHBOARD_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

  migrate:
    <<: *forge-process
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  api:
    <<: *forge-process
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["forge-api"]
    ports:
      - "${FORGE_PUBLIC_PORT:-8000}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  dispatcher:
    <<: *forge-process
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["forge-dispatcher"]

  worker:
    <<: *forge-process
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["forge-worker"]
    stop_grace_period: 2m

  scheduler:
    <<: *forge-process
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["forge-scheduler"]

  recovery:
    <<: *forge-process
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["forge-recovery"]

  maintenance:
    <<: *forge-process
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["forge-maintenance"]
